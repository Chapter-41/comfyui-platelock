[project]
name = "comfyui-platelock"
version = "0.1.0"
description = "Frame-accurate retiming of AI-generated video onto its source plate: offsets, drift, duplicate and skipped frames."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8"]

[project.scripts]
platelock = "platelock.cli:main"

[tool.setuptools]
packages = ["platelock"]

[tool.comfy]
PublisherId = ""
DisplayName = "PlateLock"
